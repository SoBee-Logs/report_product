spring:
  application:
    name: sobee
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

finance:
  api:
    key: ${FINANCE_API_KEY}


cardgorilla:
  api:
    url: https://api.cardgorilla.com
    key: ${CARDGORILLA_API_KEY}   # 환경변수로 관리

fss:
  api:
    url: https://finlife.fss.or.kr/finlifeapi
    key: ${FINANCE_API_KEY}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-secret: ${INTERNAL_SECRET_KEY:5b2ffcab30e9e662b4ff4b9e184506ef22d64647eda0fb122bb9bf1b4444bdcb}

